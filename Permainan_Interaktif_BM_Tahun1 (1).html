<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permainan Ceria Bahasa Melayu Tahun 1</title><style>body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#d9f7ff,#fff0c4);color:#20304a;text-align:center}header{background:#6046d8;color:white;padding:14px}h1{margin:5px;font-size:clamp(24px,4vw,42px)}button{cursor:pointer;border:0;border-radius:18px;background:#fff;padding:14px 22px;margin:7px;font-size:clamp(18px,2.4vw,28px);box-shadow:0 5px 0 #c8c7d3}button:hover{transform:translateY(-2px)}.nav button{background:#ffe15d}.panel{max-width:1100px;margin:18px auto;padding:18px;background:#ffffffd9;border-radius:26px;min-height:410px}.big{font-size:clamp(30px,6vw,70px);font-weight:800;margin:24px}.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.tile{min-width:110px;min-height:85px;background:#ffd1e5}.hidden{display:none}.status{font-size:24px;font-weight:700}.action{background:#9bffca}.score{background:#fff;padding:8px 15px;border-radius:12px;display:inline-block}.small{font-size:17px}#wheel{width:min(65vw,330px);height:min(65vw,330px);border-radius:50%;border:12px solid white;background:conic-gradient(#ff7e9d 0 45deg,#ffe063 45deg 90deg,#6fe7d1 90deg 135deg,#a5a5ff 135deg 180deg,#ffac69 180deg 225deg,#90e27c 225deg 270deg,#f0a9ef 270deg 315deg,#82cbff 315deg);margin:20px auto;display:grid;place-items:center;transition:transform 1.8s cubic-bezier(.15,.7,.2,1);box-shadow:0 8px 25px #7777}#wheel span{background:white;border-radius:40px;padding:15px;font-size:30px}footer{padding:10px}</style><header><h1>🌈 Permainan Ceria Bahasa Melayu Tahun 1</h1><div>Guru kawal komputer • Murid jawab secara lisan • Paparan skrin kelas</div></header><div class="nav"><button onclick="show('wheel')">🎡 Roda Misteri</button><button onclick="show('box')">🎁 Kotak Misteri</button><button onclick="show('balloon')">🎈 Pecahkan Belon</button><button onclick="show('match')">🧩 Cari Pasangan</button><button onclick="show('race')">🏎️ Perlumbaan</button><button onclick="show('treasure')">🏝️ Harta Karun</button></div><main class="panel"><h2 id="heading"></h2><div id="area"></div><p id="msg" class="status"></p><button class="action" onclick="next()">🔄 Soalan / Pusingan Baharu</button><button onclick="speak()">🔊 Baca Soalan</button><div class="small">Suara bergantung pada pilihan Bahasa Melayu yang tersedia dalam pelayar.</div></main><footer>Tip: Tekan F11 untuk paparan skrin penuh.</footer><script>
const bank=[['🍎','epal','Baca perkataan: epal'],['🐈','kucing','Bina ayat dengan perkataan kucing'],['🚗','kereta','Baca perkataan: kereta'],['📚','buku','Bina ayat dengan perkataan buku'],['🌸','bunga','Baca perkataan: bunga'],['🏠','rumah','Bina ayat dengan perkataan rumah'],['🐟','ikan','Baca perkataan: ikan'],['🚌','bas','Bina ayat dengan perkataan bas'],['🍚','nasi','Baca perkataan: nasi'],['🥛','susu','Bina ayat dengan perkataan susu'],['🪁','layang-layang','Baca perkataan: layang-layang'],['👟','kasut','Bina ayat dengan perkataan kasut'],['🧢','topi','Baca perkataan: topi'],['🌳','pokok','Bina ayat dengan perkataan pokok'],['🪑','kerusi','Baca perkataan: kerusi'],['🎒','beg','Bina ayat dengan perkataan beg']];let mode='wheel',idx=0,rot=0,opened=new Set(),flipped=[],matched=new Set(),race=[0,0],team=0,step=0,question='';const $=id=>document.getElementById(id),pick=()=>bank[Math.floor(Math.random()*bank.length)];function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.78;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='ms-my')||voices.find(v=>v.lang.toLowerCase().startsWith('ms'))||null;speechSynthesis.speak(u)}function speak(){say(question||'Mari kita bermain!')}function show(m){mode=m;opened.clear();flipped=[];matched.clear();race=[0,0];team=0;step=0;next()}function set(title,html,msg=''){ $('heading').textContent=title;$('area').innerHTML=html;$('msg').textContent=msg}function next(){idx++;let q=pick();question=q[2];if(mode==='wheel'){set('🎡 Roda Misteri','<div id="wheel"><span>🎡 PUTAR</span></div><button onclick="spin()">PUTAR RODA!</button>','Putar roda dan baca cabaran!')}if(mode==='box'){opened.clear();set('🎁 Kotak Misteri','<div class="cards">'+Array.from({length:9},(_,i)=>`<button class="tile" id="b${i}" onclick="reveal(${i},'b')">🎁 ${i+1}</button>`).join('')+'</div>','Pilih satu kotak!')}if(mode==='balloon'){opened.clear();set('🎈 Pecahkan Belon','<div class="cards">'+Array.from({length:10},(_,i)=>`<button class="tile" id="p${i}" onclick="reveal(${i},'p')">🎈 ${i+1}</button>`).join('')+'</div>','Pilih belon dan baca!')}if(mode==='match'){let items=bank.slice((idx*4)%12,(idx*4)%12+4);window.pairs=items.flatMap((x,i)=>[{id:i,face:x[0]},{id:i,face:x[1]}]).sort(()=>Math.random()-.5);set('🧩 Cari Pasangan','<div class="cards">'+window.pairs.map((x,i)=>`<button class="tile" id="m${i}" onclick="flip(${i})">❓</button>`).join('')+'</div>','Cari gambar dan perkataan yang sepadan!')}if(mode==='race')drawRace();if(mode==='treasure'){step=0;drawTreasure()}}function spin(){rot+=1080+Math.floor(Math.random()*8)*45;$('wheel').style.transform=`rotate(${rot}deg)`;setTimeout(()=>{let q=pick();question=q[2];$('msg').textContent='⭐ '+q[0]+' '+q[2];say(question)},1850)}function reveal(i,p){if(opened.has(i))return;opened.add(i);let q=pick();question=q[2];$(p+i).innerHTML=q[0]+'<div class="small">'+q[1]+'</div>';$(p+i).style.background='#a6ffd0';$('msg').textContent=q[2];say(question)}function flip(i){if(matched.has(i)||flipped.includes(i)||flipped.length===2)return;flipped.push(i);$('m'+i).textContent=pairs[i].face;if(flipped.length===2){let [a,b]=flipped;if(pairs[a].id===pairs[b].id){matched.add(a);matched.add(b);$('m'+a).style.background=$('m'+b).style.background='#a6ffd0';$('msg').textContent='🌟 Bagus! Pasangan betul!';flipped=[];if(matched.size===pairs.length)$('msg').textContent='🏆 Semua pasangan berjaya!'}else{setTimeout(()=>{if($('m'+a))$('m'+a).textContent='❓';if($('m'+b))$('m'+b).textContent='❓';flipped=[]},900)}}}function drawRace(){let q=pick();question=q[2];set('🏎️ Perlumbaan Kereta',`<div class="big">${q[0]} ${q[1]}</div><p>${q[2]}</p><p class="score">🔴 Merah: ${race[0]} mata</p> <p class="score">🔵 Biru: ${race[1]} mata</p><div style="font-size:36px">${'🟩'.repeat(Math.min(race[0],10))}🏎️</div><div style="font-size:36px">${'🟦'.repeat(Math.min(race[1],10))}🏎️</div><button onclick="point(0)">🔴 Merah +1</button><button onclick="point(1)">🔵 Biru +1</button><button onclick="drawRace()">Soalan seterusnya ➡️</button>`,'Guru beri mata selepas murid menjawab dengan betul.')}function point(t){race[t]++;drawRace();if(race[t]>=10)$('msg').textContent='🏆 Pasukan '+(t===0?'Merah':'Biru')+' menang!'}function drawTreasure(){let q=pick();question=q[2];set('🏝️ Misi Harta Karun',`<div class="big">${step>=5?'🏆💎🎉':'🗺️ '+('⭐'.repeat(step))+'🔒'.repeat(5-step)}</div><div class="big">${q[0]} ${q[1]}</div><p>${q[2]}</p><button onclick="unlock()">✅ Jawapan betul — buka petunjuk</button>`,step>=5?'Tahniah! Harta karun ditemui!':'Selesaikan 5 cabaran untuk membuka harta karun!')}function unlock(){if(step<5)step++;drawTreasure()}show('wheel');</script></html>

<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bacaan Interaktif Bahasa Melayu Tahun 1</title><style>
:root{--ink:#15324b;--blue:#37b4f5}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:linear-gradient(135deg,#e9f9ff,#fff6d9);color:var(--ink)}header{text-align:center;padding:20px 12px 8px}h1{margin:0;font-size:clamp(25px,4vw,40px)}.sub{margin:6px 0 0}.toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px}.toolbar select,.toolbar button,.nav button{font:inherit;border:2px solid #c3dbe9;background:white;border-radius:14px;padding:10px 15px;cursor:pointer}.toolbar button,.nav button{font-weight:bold}.shell{max-width:1120px;margin:0 auto;padding:0 15px 30px}.slide{min-height:450px;border-radius:30px;box-shadow:0 14px 35px #19415b25;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#39b9ff}.slide h2{font-size:clamp(26px,4vw,43px);margin:0 0 24px}.tiles{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{background:#ffffffd9;border:0;border-radius:18px;padding:14px 6px;min-height:72px;font-size:clamp(17px,2.5vw,29px);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #00000015}.tile:hover,.tile:focus{outline:4px solid #6a44f7;transform:translateY(-2px)}.tile span{display:block;font-size:28px;margin-bottom:3px}.sentence{font-size:clamp(23px,3.3vw,37px);line-height:1.65;text-align:left;max-width:940px;margin:0 auto}.sentence p{margin:10px 0}.sentence button{font:inherit;text-align:left;border:0;background:#ffffffd9;border-radius:15px;padding:9px 18px;cursor:pointer;width:100%;margin:5px 0}.sentence button:hover{outline:3px solid #7255eb}.story{background:#fffef2;border-radius:22px;padding:25px;font-size:clamp(22px,2.5vw,31px);line-height:1.65;text-align:left;max-width:970px}.story p{margin:0 0 15px}.story p:last-child{margin-bottom:0}.story p:hover{background:#f7f0ca;cursor:pointer}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0}.nav strong{font-size:20px}.tip{text-align:center;font-size:14px;opacity:.8}.colors .tile{color:#102d43}.end{font-size:clamp(42px,7vw,80px);font-weight:900}.stop{background:#ffe2e2!important}@media(max-width:600px){.slide{padding:15px;min-height:520px}.tiles{gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:63px;padding:8px 3px}.story{padding:15px}}
</style></head><body><header><h1>🌈 Jom Baca! Bahasa Melayu Tahun 1</h1><p class="sub">Tekan perkataan atau ayat untuk mendengar bacaannya 🔊</p></header><div class="toolbar"><label>Suara: <select id="voice" aria-label="Pilih suara"></select></label><label>Kelajuan: <select id="speed"><option value="0.7">Perlahan</option><option value="0.85" selected>Sederhana</option><option value="1">Biasa</option></select></label><button id="read">🔊 Baca semua</button><button id="stop" class="stop">⏹ Henti</button></div><main class="shell"><section class="slide" id="slide" aria-live="polite"></section><div class="nav"><button id="prev">⬅ Sebelum</button><strong id="counter"></strong><button id="next">Seterusnya ➡</button></div><p class="tip">Suara Bahasa Melayu bergantung pada suara yang tersedia dalam Chrome/Windows. Untuk suara Yasmin Luv yang tepat, audio atau akses kepada perkhidmatan suara tersebut diperlukan.</p></main><script>
const slides=[
{title:'Perkataan Asas',words:['Sepuluh','Abang','Di bawah','Ayam','Kelas','Di atas','Belon','Hadiah','Di depan','Beg','Sayur','Di belakang','Katil','Rambut','Di dalam']},
{title:'Jom Kenal Perkataan',words:['Menari','Lilin','Bola','Doktor','Pantai','Topi parti','Taman','Lampu','Kawan','Susu','Murid','Zoo','Minum','Kasut','Sarapan']},
{title:'Pekerjaan dan Tempat',words:['Kereta api','Dua puluh','Kerusi','Hospital','Anak patung','Bas','Penyanyi','Telur','Ahli bomba','Polis']},
{title:'Nombor dan Warna',words:['Kolam','Biru','Ungu','Sebelas','Putih','Coklat','Dua belas','Kuning','Hitam','Lima belas','Hijau','Merah','Jingga']},
{title:'Baca dan Sebut',words:['Sepuluh','Beg','Ayam','Katil','Belon','Abang'],emoji:['🔟','🎒','🐓','🛏️','🎈','👦']},
{title:'Baca dan Sebut',words:['Kelas','Rambut','Hadiah','Menari','Sayur','Doktor'],emoji:['🏫','👧','🎁','💃','🥦','👨‍⚕️']},
{title:'Baca dan Sebut',words:['Taman','Lilin','Susu','Pantai','Minum','Lampu'],emoji:['🏞️','🕯️','🥛','🏝️','🥤','💡']},
{title:'Baca dan Sebut',words:['Murid','Topi parti','Kasut','Kawan','Bola','Zoo'],emoji:['🧒','🥳','👟','👫','⚽','🦒']},
{title:'Baca dan Sebut',words:['Sarapan','Penyanyi','Kerusi','Anak patung','Kereta api','Telur'],emoji:['🍳','🎤','🪑','🧸','🚆','🥚']},
{title:'Baca dan Sebut',words:['Ahli bomba','Bas','Dua puluh','Polis','Hospital','Kolam'],emoji:['🧑‍🚒','🚌','2️⃣0️⃣','👮','🏥','🌸']},
{title:'Nombor dan Kata Arah',words:['Sebelas','Di atas','Dua belas','Di dalam','Lima belas','Di bawah'],emoji:['1️⃣1️⃣','⬆️','1️⃣2️⃣','📦','1️⃣5️⃣','⬇️']},
{title:'Kata Arah dan Warna',words:['Di depan','Biru','Di belakang','Hijau','Merah','Kuning'],emoji:['➡️','⭐','↩️','🟩','🔴','🟨']},
{title:'Kenali Warna',words:['Hitam','Coklat','Ungu','Jingga','Putih'],colors:['#151515','#85502b','#8a20c5','#ff8700','#fff']},
{title:'Baca Ayat Mudah',sentences:['Siti mengayuh basikal.','Adik suka belon.','Nenek masak sayur.','Pelukis melukis gambar.','Devi buang sampah.','Kereta di luar rumah.']},
{title:'Perayaan di Malaysia',story:['Aina sambut Hari Raya Aidilfitri. Dia lihat ketupat dan kuih raya.','Ah Chong sambut Tahun Baru Cina. Dia lihat tanglung dan angpau.','Kavitha pula sambut Hari Deepavali. Dia lihat kolam dan pelita.','Mereka sambut perayaan dengan gembira.']},
{title:'Syabas!',end:true}
];
const bg=['#3bb9fa','#36b7f7','#3cb5fa','#3ab7f4','#ffda15','#ffdb15','#ffd0d0','#ffd0d0','linear-gradient(115deg,#17c4d5,#ffe45a)','linear-gradient(115deg,#17c4d5,#ffe45a)','linear-gradient(115deg,#15d1db,#ffe45a)','#fff0cb','#fff4d4','#7dd64c','#20b9d1','#7dd64c'];let idx=0,voices=[];const el=document.getElementById('slide'),vsel=document.getElementById('voice');
function loadVoices(){if(!('speechSynthesis' in window)){vsel.innerHTML='<option>Tiada sokongan audio</option>';return}voices=speechSynthesis.getVoices();let old=vsel.value;vsel.innerHTML='';const sorted=voices.map((v,i)=>({v,i})).sort((a,b)=>{let rank=x=>x.v.lang.toLowerCase().startsWith('ms')?0:x.v.lang.toLowerCase().startsWith('id')?1:2;return rank(a)-rank(b)});sorted.forEach(({v,i})=>{let o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';vsel.appendChild(o)});if(old&&voices[+old])vsel.value=old;else if(sorted.length)vsel.value=sorted[0].i}
loadVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
function speak(text){if(!('speechSynthesis' in window)){alert('Pelayar ini tidak menyokong suara. Cuba Google Chrome.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ms-MY';u.rate=Number(document.getElementById('speed').value);let voice=voices[Number(vsel.value)];if(voice){u.voice=voice;u.lang=voice.lang}speechSynthesis.speak(u)}
function render(){speechSynthesis?.cancel();let s=slides[idx];el.style.background=bg[idx];el.innerHTML='';let h=document.createElement('h2');h.textContent=s.title;el.append(h);if(s.words){let grid=document.createElement('div');grid.className='tiles'+(s.colors?' colors':'');s.words.forEach((w,i)=>{let b=document.createElement('button');b.className='tile';if(s.emoji){let em=document.createElement('span');em.textContent=s.emoji[i];b.append(em)}if(s.colors){let dot=document.createElement('span');dot.style.cssText='width:90%;height:45px;border:1px solid #ddd;border-radius:7px;margin:0 auto 8px;background:'+s.colors[i];b.append(dot)}b.append(document.createTextNode(w));b.onclick=()=>speak(w);grid.append(b)});el.append(grid)}if(s.sentences){let d=document.createElement('div');d.className='sentence';s.sentences.forEach(x=>{let b=document.createElement('button');b.textContent='🔊 '+x;b.onclick=()=>speak(x);d.append(b)});el.append(d)}if(s.story){let d=document.createElement('div');d.className='story';s.story.forEach(x=>{let p=document.createElement('p');p.textContent=x;p.title='Klik untuk dengar';p.onclick=()=>speak(x);d.append(p)});el.append(d)}if(s.end){let d=document.createElement('div');d.className='end';d.textContent='🎉 Terima kasih! 🌟';el.append(d)}document.getElementById('counter').textContent=`Slaid ${idx+1} / ${slides.length}`;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1}
document.getElementById('read').onclick=()=>{let s=slides[idx];speak((s.words||s.sentences||s.story||[s.title]).join('. '))};document.getElementById('stop').onclick=()=>speechSynthesis?.cancel();document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(idx<slides.length-1){idx++;render()}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx<slides.length-1){idx++;render()}if(e.key==='ArrowLeft'&&idx>0){idx--;render()}});render();
</script></body></html>
